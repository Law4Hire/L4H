---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: l4h
spec:
  accessModes:
    - ReadWriteOnce  # Single node - all pods access same volume
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: l4h
data:
  ASPNETCORE_URLS: "http://0.0.0.0:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  RUN_SEED_ON_START: "false"
  # Uploads configuration
  Uploads__BasePath: "/data/uploads"
  Uploads__QuarantineSubdir: "quarantine"
  Uploads__CleanSubdir: "clean"
  Uploads__Gateway__PublicBaseUrl: "https://SERVER_IP.nip.io/gateway"  # Will be replaced
  Uploads__Token__TtlMinutes: "30"
  # Provider configuration (Fake for now)
  Payments__Stripe__Mode: "Fake"
  Graph__Mode: "Fake"
  Meetings__Mode: "Fake"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: l4h
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: l4h
spec:
  replicas: 1  # Temporarily 1 to avoid migration deadlock - TODO: implement migration Job
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/law4hire/l4h-api:latest  # Will be updated by CI/CD
        command: ["/bin/sh"]
        args:
          - -c
          - |
            export ConnectionStrings__SqlServer="Server=sqlserver,1433;Database=L4H;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
            dotnet L4H.Api.dll
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: api-config
        env:
        - name: SQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: l4h-secrets
              key: sql-sa-password
        - name: Auth__Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: l4h-secrets
              key: jwt-signing-key
        - name: ADMIN_SEED_PASSWORD
          valueFrom:
            secretKeyRef:
              name: l4h-secrets
              key: admin-seed-password
        - name: Uploads__Token__SigningKey
          valueFrom:
            secretKeyRef:
              name: l4h-secrets
              key: uploads-token-signing-key
        volumeMounts:
        - name: uploads-data
          mountPath: /data/uploads
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 180  # Increased to allow migrations and seeding to complete
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 180  # Increased to allow migrations and seeding to complete
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: uploads-data
        persistentVolumeClaim:
          claimName: uploads-data
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z sqlserver 1433; do echo waiting for database; sleep 2; done;']
