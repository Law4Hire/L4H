apiVersion: v1
kind: Secret
metadata:
  name: l4h-secrets
  namespace: l4h
type: Opaque
stringData:
  # SQL Server SA password
  sql-sa-password: "REPLACE_WITH_SQL_SA_PASSWORD"

  # JWT signing key (minimum 32 characters)
  jwt-signing-key: "REPLACE_WITH_JWT_SIGNING_KEY"

  # Upload token signing key (minimum 32 characters)
  uploads-token-signing-key: "REPLACE_WITH_UPLOADS_TOKEN_SIGNING_KEY"

  # Admin seed password
  admin-seed-password: "REPLACE_WITH_ADMIN_SEED_PASSWORD"

# Note: In production, create secrets using:
