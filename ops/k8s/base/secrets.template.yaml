#   --from-literal=sql-sa-password='YOUR_VALUE' \
#   --from-literal=jwt-signing-key='YOUR_VALUE' \
#   --from-literal=uploads-token-signing-key='YOUR_VALUE' \
#   --from-literal=admin-seed-password='YOUR_VALUE' \
#   -n l4h
