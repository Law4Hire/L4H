---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-l4h
  namespace: l4h
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-cannlaw
  namespace: l4h
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: l4h
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: l4h
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: ghcr.io/law4hire/l4h-web:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - mountPath: /usr/share/nginx/html/l4h
          name: web-l4h
          readOnly: true
        - mountPath: /usr/share/nginx/html/cannlaw
          name: web-cannlaw
          readOnly: true
        - mountPath: /etc/nginx/conf.d
          name: nginx-config
          readOnly: true
      volumes:
      - name: web-l4h
        persistentVolumeClaim:
          claimName: web-l4h
      - name: web-cannlaw
        persistentVolumeClaim:
          claimName: web-cannlaw
      - name: nginx-config
        configMap:
          name: nginx-config
          defaultMode: 420
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: l4h
data:
  default.conf: |
    # Law4Hire site
    server {
        listen 80;
        server_name l4h.74-208-77-43.nip.io;

        root /usr/share/nginx/html/l4h;
        index index.html;

        # Proxy API requests - ^~ takes precedence over regex locations
        # (prevents ~* extension regex from intercepting /api/v1/uploads/images/...)
        location ^~ /api {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache hashed assets for 1 year (they have content hashes in filename)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Never cache index.html to ensure users get latest version
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "HEALTHY-STABLE\n";
            add_header Content-Type text/plain;
        }
    }

    # Cannlaw site
    server {
        listen 80;
        server_name cannlaw.74-208-77-43.nip.io;

        root /usr/share/nginx/html/cannlaw;
        index index.html;

        # Proxy API requests - ^~ takes precedence over regex locations
        location ^~ /api {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache hashed assets for 1 year (they have content hashes in filename)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Never cache index.html to ensure users get latest version
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "HEALTHY-STABLE\n";
            add_header Content-Type text/plain;
        }
    }

    # Default server for health checks and other requests
    server {
        listen 80 default_server;
        server_name _;

        # Health check
        location /health {
            access_log off;
            return 200 "HEALTHY-STABLE\n";
            add_header Content-Type text/plain;
        }

        # Proxy API requests (fallback for all hosts) - ^~ takes precedence over regex
        location ^~ /api {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # All other requests return 404
        location / {
            return 404;
        }
    }
