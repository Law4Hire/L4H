apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: l4h-ingress
  namespace: l4h-prod
spec:
  rules:
  - host: l4h-prod.74-208-77-43.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-prod
            port:
              number: 80
  - host: cannlaw-prod.74-208-77-43.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-prod
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-prod
            port:
              number: 8080
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: upload-gateway-prod
            port:
              number: 7070
  - host: api-prod.74-208-77-43.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-prod
            port:
              number: 8080
