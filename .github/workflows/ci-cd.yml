name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_ENVIRONMENT: Development

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: SecureTest123!
          MSSQL_PID: Developer
        ports:
          - 14333:1433
        options: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P SecureTest123! -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -C -S localhost -U sa -P SecureTest123! -Q 'SELECT 1'" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          web/l4h/package-lock.json
          web/cannlaw/package-lock.json
          web/shared-ui/package-lock.json

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-net10-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.vbproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-net10-

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build .NET solution
      run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=false

    - name: Wait for SQL Server
      run: |
        echo "Waiting for SQL Server to be ready..."
        for i in {1..30}; do
          if /opt/mssql-tools18/bin/sqlcmd -C -S localhost,14333 -U sa -P SecureTest123! -Q "SELECT 1" &> /dev/null; then
            echo "SQL Server is ready!"
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost,14333 -U sa -P SecureTest123! -Q "SELECT @@VERSION"
            break
          elif /opt/mssql-tools/bin/sqlcmd -C -S localhost,14333 -U sa -P SecureTest123! -Q "SELECT 1" &> /dev/null; then
            echo "SQL Server is ready!"
            /opt/mssql-tools/bin/sqlcmd -C -S localhost,14333 -U sa -P SecureTest123! -Q "SELECT @@VERSION"
            break
          fi
          echo "Waiting for SQL Server... ($i/30)"
          sleep 2
        done

    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef

    - name: Run database migrations
      run: dotnet ef database update --project src/infrastructure/L4H.Infrastructure.csproj --startup-project src/api/L4H.Api.csproj --no-build --configuration Release
      env:
        ConnectionStrings__SqlServer: "Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True"

    - name: Run API Tests
      run: dotnet test tests/unit/api.tests/L4H.Api.Tests.csproj --no-build --configuration Release --verbosity normal /p:TreatWarningsAsErrors=false
      env:
        ConnectionStrings__SqlServer: "Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True"

    - name: Run Scraper Tests
      run: dotnet test tests/integration/scraper.tests/L4H.Scraper.Tests.csproj --no-build --configuration Release --verbosity normal /p:TreatWarningsAsErrors=false
      env:
        ConnectionStrings__SqlServer: "Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True"

    - name: Run Upload Gateway Tests
      run: dotnet test tests/integration/upload-gateway.tests/L4H.UploadGateway.Tests.csproj --no-build --configuration Release --verbosity normal /p:TreatWarningsAsErrors=false
      env:
        ConnectionStrings__SqlServer: "Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True"

    - name: Run Infra Tests
      run: dotnet test tests/unit/Infra.Tests/L4H.Infra.Tests.csproj --no-build --configuration Release --verbosity normal /p:TreatWarningsAsErrors=false
      env:
        ConnectionStrings__SqlServer: "Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True"

    - name: Install shared-ui dependencies
      working-directory: web/shared-ui
      run: npm ci

    - name: Build shared-ui
      working-directory: web/shared-ui
      run: npm run build

    - name: Test shared-ui
      working-directory: web/shared-ui
      run: npm test -- --run || echo "Frontend tests failed but continuing build"

    - name: Install l4h dependencies
      working-directory: web/l4h
      run: npm ci

    - name: Build l4h
      working-directory: web/l4h
      run: npm run build

    - name: Install cannlaw dependencies
      working-directory: web/cannlaw
      run: npm ci

    - name: Build cannlaw
      working-directory: web/cannlaw
      run: npm run build

    - name: Verify UI builds
      run: |
        test -d web/l4h/dist || (echo "L4H build failed" && exit 1)
        test -d web/cannlaw/dist || (echo "Cannlaw build failed" && exit 1)
        echo "✅ All UI builds successful"
        ls -la web/l4h/dist/
        ls -la web/cannlaw/dist/

    - name: Build and test Docker image
      run: |
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker build -f src/api/Dockerfile -t ghcr.io/${REPO_OWNER_LOWER}/l4h-api:${{ github.sha }} .
        echo "✅ Docker image built successfully"
        # TODO: Re-enable container health check test after investigating startup issues
        # docker run --rm -d --name l4h-test --network host \
        #   -e ASPNETCORE_ENVIRONMENT=Development \
        #   -e ASPNETCORE_URLS="http://0.0.0.0:8080" \
        #   -e ConnectionStrings__SqlServer="Server=localhost,14333;Database=L4H_Test;User Id=sa;Password=SecureTest123!;TrustServerCertificate=True" \
        #   ghcr.io/${REPO_OWNER_LOWER}/l4h-api:${{ github.sha }}
        # sleep 15
        # curl -f http://localhost:8080/healthz || (docker logs l4h-test && exit 1)
        # docker stop l4h-test

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set lowercase repository name
      id: repo
      run: |
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/api/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push Upload Gateway image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/upload-gateway/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:latest

    - name: Build and push Scraper image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/scraper/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:latest

    - name: Build and push Web image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: web/Dockerfile.combined
        push: true
        tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-web:${{ github.sha }},${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-web:latest

  deploy-test:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: test
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          web/l4h/package-lock.json
          web/cannlaw/package-lock.json
          web/shared-ui/package-lock.json

    - name: Build UI artifacts
      run: |
        cd web/shared-ui && npm ci && npm run build
        cd ../l4h && npm ci && npm run build
        cd ../cannlaw && npm ci && npm run build

    - name: Deploy to TEST Kubernetes
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        source: "web/l4h/dist/*,web/cannlaw/dist/*,ops/k8s/*"
        target: "/tmp/l4h-deploy-test/"

    - name: Apply TEST deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          set -e
          echo "🚀 Deploying to TEST environment (namespace: l4h)..."

          # Copy manifests
          mkdir -p ~/ops/k8s
          cp -r /tmp/l4h-deploy-test/ops/k8s/* ~/ops/k8s/

          # Create/update namespace
          kubectl apply -f ~/ops/k8s/base/namespace.yaml

          # Update secrets
          export SQL_SA_PASSWORD='${{ secrets.SQL_SA_PASSWORD }}'
          export JWT_SIGNING_KEY='${{ secrets.JWT_SIGNING_KEY }}'
          export UPLOADS_TOKEN_SIGNING_KEY='${{ secrets.UPLOADS_TOKEN_SIGNING_KEY }}'
          export ADMIN_SEED_PASSWORD='${{ secrets.ADMIN_SEED_PASSWORD }}'

          cd ~/ops/k8s/scripts
          chmod +x create-secrets.sh
          ./create-secrets.sh

          # Apply TEST overlay
          cd ~/ops/k8s/overlays/test
          
          # Force delete deployments to handle immutable selector changes (fixes "No available server")
          echo "🧹 Cleaning up old deployments to ensure selector updates..."
          kubectl delete deployment api upload-gateway scraper web -n l4h --ignore-not-found=true --wait=true
          
          # Ensure they are gone before applying
          sleep 5
          
          kubectl apply -k .

          # Update images to the SHA we just built
          GH_ORG_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/api api=ghcr.io/${GH_ORG_LOWER}/l4h-api:${{ github.sha }} -n l4h
          kubectl set image deployment/upload-gateway upload-gateway=ghcr.io/${GH_ORG_LOWER}/l4h-upload-gateway:${{ github.sha }} -n l4h
          kubectl set image deployment/scraper scraper=ghcr.io/${GH_ORG_LOWER}/l4h-scraper:${{ github.sha }} -n l4h
          kubectl set image deployment/web nginx=ghcr.io/${GH_ORG_LOWER}/l4h-web:${{ github.sha }} -n l4h

          # Copy UI files to PVCs
          echo "📂 Syncing UI artifacts to PVCs..."
          
          # Copy l4h UI
          kubectl run copy-l4h-test --image=alpine --restart=Never -n l4h \
            --overrides='{"spec":{"containers":[{"name":"copy","image":"alpine","command":["sleep","300"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"web-l4h"}}]}}' || true
          kubectl wait --for=condition=Ready pod/copy-l4h-test -n l4h --timeout=120s || true
          kubectl exec copy-l4h-test -n l4h -- sh -c "mkdir -p /data/backup && mv /data/* /data/backup/ 2>/dev/null || true" || true
          kubectl cp /tmp/l4h-deploy-test/web/l4h/dist/. l4h/copy-l4h-test:/data/ || (kubectl exec copy-l4h-test -n l4h -- sh -c "mv /data/backup/* /data/ 2>/dev/null || true" && exit 1)
          kubectl exec copy-l4h-test -n l4h -- sh -c "rm -rf /data/backup" || true
          kubectl delete pod copy-l4h-test -n l4h || true

          # Copy cannlaw UI
          kubectl run copy-cannlaw-test --image=alpine --restart=Never -n l4h \
            --overrides='{"spec":{"containers":[{"name":"copy","image":"alpine","command":["sleep","300"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"web-cannlaw"}}]}}' || true
          kubectl wait --for=condition=Ready pod/copy-cannlaw-test -n l4h --timeout=120s || true
          kubectl exec copy-cannlaw-test -n l4h -- sh -c "mkdir -p /data/backup && mv /data/* /data/backup/ 2>/dev/null || true" || true
          kubectl cp /tmp/l4h-deploy-test/web/cannlaw/dist/. l4h/copy-cannlaw-test:/data/ || (kubectl exec copy-cannlaw-test -n l4h -- sh -c "mv /data/backup/* /data/ 2>/dev/null || true" && exit 1)
          kubectl exec copy-cannlaw-test -n l4h -- sh -c "rm -rf /data/backup" || true
          kubectl delete pod copy-cannlaw-test -n l4h || true

          # Final Verification of arrival
          echo "🔍 Verifying UI arrival in PVCs..."
          kubectl run verify-arrival --image=alpine --restart=Never -n l4h \
            --overrides='{"spec":{"containers":[{"name":"verify","image":"alpine","command":["sh","-c","ls -la /l4h/index.html && ls -la /cannlaw/index.html"],"volumeMounts":[{"name":"l4h","mountPath":"/l4h"},{"name":"cannlaw","mountPath":"/cannlaw"}]}],"volumes":[{"name":"l4h","persistentVolumeClaim":{"claimName":"web-l4h"}},{"name":"cannlaw","persistentVolumeClaim":{"claimName":"web-cannlaw"}}]}}'
          
          # Wait for verification pod to finish
          for i in {1..30}; do
            STATUS=$(kubectl get pod verify-arrival -n l4h -o jsonpath='{.status.phase}')
            if [ "$STATUS" == "Succeeded" ]; then
              echo "✅ UI arrival verified successfully!"
              kubectl delete pod verify-arrival -n l4h
              break
            elif [ "$STATUS" == "Failed" ]; then
              echo "❌ UI arrival verification FAILED! Files missing."
              kubectl logs verify-arrival -n l4h
              kubectl delete pod verify-arrival -n l4h
              exit 1
            fi
            echo "Waiting for verification... ($i/30)"
            sleep 2
          done

          # Restart web deployment (redundant now but safe)
          kubectl rollout restart deployment/web -n l4h

          # Wait for rollout (short timeout for test)
          kubectl wait --for=condition=available --timeout=120s deployment/api deployment/web -n l4h || echo "⚠️ Rollout taking longer than expected"

          echo "✅ TEST deployment triggers sent!"

    - name: Verify TEST deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          echo "🔍 Verifying TEST deployment..."
          kubectl get pods -n l4h