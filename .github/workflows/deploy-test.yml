name: Deploy to TEST Environment

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set lowercase repository name
      id: repo
      run: |
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images (TEST)
      run: |
        # Build and push API
        docker build -f src/api/Dockerfile -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:test-${{ github.sha }} -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:test-latest .
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:test-${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-api:test-latest

        # Build and push Upload Gateway
        docker build -f src/upload-gateway/Dockerfile -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:test-${{ github.sha }} -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:test-latest .
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:test-${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-upload-gateway:test-latest

        # Build and push Scraper
        docker build -f src/scraper/Dockerfile -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:test-${{ github.sha }} -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:test-latest .
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:test-${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository_lower }}-scraper:test-latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          web/l4h/package-lock.json
          web/cannlaw/package-lock.json
          web/shared-ui/package-lock.json

    - name: Build UI artifacts
      run: |
        cd web/shared-ui && npm ci && npm run build
        cd ../l4h && npm ci && npm run build
        cd ../cannlaw && npm ci && npm run build

    - name: Deploy to TEST Kubernetes
      if: vars.KUBERNETES_ENABLED == 'true' || secrets.DEPLOY_HOST
      continue-on-error: true
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        source: "web/l4h/dist/*,web/cannlaw/dist/*,ops/k8s/*"
        target: "/tmp/l4h-deploy-test/"

    - name: Apply TEST deployment
      if: vars.KUBERNETES_ENABLED == 'true' || secrets.DEPLOY_HOST
      continue-on-error: true
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          set -e
          echo "🚀 Deploying to TEST environment (namespace: l4h)..."

          # Copy manifests
          mkdir -p ~/ops/k8s
          cp -r /tmp/l4h-deploy-test/ops/k8s/* ~/ops/k8s/

          # Create/update namespace
          kubectl apply -f ~/ops/k8s/base/namespace.yaml

          # Update secrets
          export SQL_SA_PASSWORD='${{ secrets.SQL_SA_PASSWORD }}'
          export JWT_SIGNING_KEY='${{ secrets.JWT_SIGNING_KEY }}'
          export UPLOADS_TOKEN_SIGNING_KEY='${{ secrets.UPLOADS_TOKEN_SIGNING_KEY }}'
          export ADMIN_SEED_PASSWORD='${{ secrets.ADMIN_SEED_PASSWORD }}'

          cd ~/ops/k8s/scripts
          chmod +x create-secrets.sh
          ./create-secrets.sh

          # Apply TEST overlay
          cd ~/ops/k8s/overlays/test
          kubectl apply -k .

          # Update images to TEST tags
          GH_ORG_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          kubectl set image deployment/api api=ghcr.io/${GH_ORG_LOWER}/l4h-api:test-${{ github.sha }} -n l4h
          kubectl set image deployment/upload-gateway upload-gateway=ghcr.io/${GH_ORG_LOWER}/l4h-upload-gateway:test-${{ github.sha }} -n l4h
          kubectl set image deployment/scraper scraper=ghcr.io/${GH_ORG_LOWER}/l4h-scraper:test-${{ github.sha }} -n l4h

          # Copy UI artifacts
          kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/web-l4h -n l4h --timeout=120s || echo "⚠️ PVC not ready"
          kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/web-cannlaw -n l4h --timeout=120s || echo "⚠️ PVC not ready"

          # Copy l4h UI
          kubectl run copy-l4h --image=alpine --restart=Never -n l4h \
            --overrides='{"spec":{"containers":[{"name":"copy","image":"alpine","command":["sleep","300"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"web-l4h"}}]}}' || true
          kubectl wait --for=condition=Ready pod/copy-l4h -n l4h --timeout=120s || true
          kubectl exec copy-l4h -n l4h -- sh -c "rm -rf /data/*" || true
          kubectl cp /tmp/l4h-deploy-test/web/l4h/dist/. l4h/copy-l4h:/data/ || true
          kubectl delete pod copy-l4h -n l4h || true

          # Copy cannlaw UI
          kubectl run copy-cannlaw --image=alpine --restart=Never -n l4h \
            --overrides='{"spec":{"containers":[{"name":"copy","image":"alpine","command":["sleep","300"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"web-cannlaw"}}]}}' || true
          kubectl wait --for=condition=Ready pod/copy-cannlaw -n l4h --timeout=120s || true
          kubectl exec copy-cannlaw -n l4h -- sh -c "rm -rf /data/*" || true
          kubectl cp /tmp/l4h-deploy-test/web/cannlaw/dist/. l4h/copy-cannlaw:/data/ || true
          kubectl delete pod copy-cannlaw -n l4h || true

          # Restart web deployment
          kubectl rollout restart deployment/web -n l4h

          # Wait for rollout
          kubectl wait --for=condition=available --timeout=300s deployment/api deployment/web -n l4h || echo "⚠️ Rollout taking longer than expected"

          # Cleanup
          rm -rf /tmp/l4h-deploy-test

          echo "✅ TEST deployment complete!"
          echo "🌐 TEST URLs:"
          echo "   L4H:     https://l4h.74-208-77-43.nip.io"
          echo "   Cannlaw: https://cannlaw.74-208-77-43.nip.io"
          echo "   API:     https://api.74-208-77-43.nip.io"

    - name: Verify TEST deployment
      if: vars.KUBERNETES_ENABLED == 'true' || secrets.DEPLOY_HOST
      continue-on-error: true
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          echo "🔍 Verifying TEST deployment..."
          kubectl get pods -n l4h
          kubectl get deployments -n l4h
          kubectl get ingress -n l4h

          # Test endpoints (allow failures as they may not be ready yet)
          sleep 10
          curl -fsSL https://l4h.74-208-77-43.nip.io || echo "⚠️ L4H not ready yet"
          curl -fsSL https://cannlaw.74-208-77-43.nip.io || echo "⚠️ Cannlaw not ready yet"
          curl -fsSL https://api.74-208-77-43.nip.io/healthz || echo "⚠️ API not ready yet"

    - name: Deployment Summary
      if: always()
      run: |
        echo "📦 TEST Build Summary"
        echo "===================="
        echo "✅ Docker images built and pushed:"
        echo "  - ghcr.io/${{ steps.repo.outputs.repository_lower }}-api:test-${{ github.sha }}"
        echo "  - ghcr.io/${{ steps.repo.outputs.repository_lower }}-upload-gateway:test-${{ github.sha }}"
        echo "  - ghcr.io/${{ steps.repo.outputs.repository_lower }}-scraper:test-${{ github.sha }}"
        echo ""
        echo "✅ UI artifacts built:"
        echo "  - l4h frontend"
        echo "  - cannlaw frontend"
        echo ""
        echo "⏭️  Kubernetes deployment SKIPPED (optional - enable with KUBERNETES_ENABLED variable)"
        echo "   To enable automatic deployment, set GitHub variable KUBERNETES_ENABLED=true"
        echo "   and configure these secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY"
        echo ""
        echo "💡 Docker images are available for manual deployment"
